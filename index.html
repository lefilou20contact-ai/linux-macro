<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Filou Macro System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

    <div>
        <h1>Filou Macro System</h1>
        <p>Macro System • Réseau local</p>
    </div>

    <div class="connection">
        <span id="statusDot" class="status-dot offline"></span>
        <span id="statusText">Déconnecté</span>
    </div>

</header>


<main>

    <!-- =========================
         CONNEXION APPAREIL
    ========================== -->

    <section class="panel">

        <div class="panel-header">
            <h2>🔗 Connexion à l'appareil</h2>
        </div>

        <p class="description">
            Entre le nom et le code de ton PC pour établir la connexion.
        </p>

        <label for="deviceName">
            Nom de l'appareil
        </label>

        <input
            id="deviceName"
            type="text"
            placeholder="Ex : Mon PC Linux"
            autocomplete="off"
        >


        <label for="deviceCode">
            Code de l'appareil
        </label>

        <input
            id="deviceCode"
            type="password"
            placeholder="Ex : FILOU-AB12-CD34"
            autocomplete="off"
        >


        <label for="deviceAddress">
            Adresse locale
        </label>

        <input
            id="deviceAddress"
            type="text"
            placeholder="Ex : 192.168.1.42:8765"
            autocomplete="off"
        >


        <div class="buttons">

            <button
                id="connectButton"
                class="button primary"
            >
                🔗 Connecter
            </button>

            <button
                id="saveConnection"
                class="button secondary"
            >
                💾 Enregistrer
            </button>

        </div>


        <div
            id="connectionMessage"
            class="message"
        ></div>

    </section>



    <!-- =========================
         CREATION MACRO
    ========================== -->

    <section class="panel">

        <div class="panel-header">

            <h2>🧩 Créer une macro</h2>

            <button
                id="resetMacro"
                class="button secondary"
            >
                Réinitialiser
            </button>

        </div>


        <label for="macroName">
            Nom
        </label>

        <input
            id="macroName"
            type="text"
            placeholder="Ex : Préparer Minecraft"
        >


        <label for="macroDescription">
            Description
        </label>

        <input
            id="macroDescription"
            type="text"
            placeholder="Description de la macro"
        >


        <h3>Actions</h3>

        <div
            id="actionList"
            class="action-list"
        ></div>


        <div class="add-action">

            <select id="actionType">

                <option value="">
                    + Ajouter une action
                </option>

                <option value="open_app">
                    🚀 Ouvrir une application
                </option>

                <option value="open_file">
                    📂 Ouvrir un fichier
                </option>

                <option value="open_url">
                    🌐 Ouvrir une URL
                </option>

                <option value="command">
                    💻 Exécuter une commande
                </option>

                <option value="text">
                    ⌨️ Écrire du texte
                </option>

                <option value="key">
                    🎹 Appuyer sur une touche
                </option>

                <option value="wait">
                    ⏱️ Attendre
                </option>

                <option value="mouse">
                    🖱️ Souris
                </option>

            </select>


            <button
                id="addAction"
                class="button primary"
            >
                Ajouter
            </button>

        </div>


        <button
            id="saveMacro"
            class="button save-button"
        >
            💾 Enregistrer la macro
        </button>

    </section>



    <!-- =========================
         MACROS
    ========================== -->

    <section class="panel">

        <div class="panel-header">

            <h2>📚 Mes macros</h2>

            <div class="buttons">

                <button
                    id="refreshMacros"
                    class="button secondary"
                >
                    🔄 Actualiser
                </button>

                <button
                    id="exportJson"
                    class="button secondary"
                >
                    ⬇️ Exporter JSON
                </button>

            </div>

        </div>


        <div
            id="macroList"
            class="macro-list"
        ></div>

    </section>



    <!-- =========================
         INFORMATIONS
    ========================== -->

    <section class="panel">

        <h2>ℹ️ Informations</h2>

        <div class="info-box">

            <span>Appareil connecté</span>

            <strong id="displayDevice">
                Aucun
            </strong>

        </div>

        <div class="info-box">

            <span>Adresse locale</span>

            <strong id="displayAddress">
                Aucune
            </strong>

        </div>

    </section>

</main>


<div
    id="toast"
    class="toast"
></div>


<script src="script.js"></script>

</body>
</html>
